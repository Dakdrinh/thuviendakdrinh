<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện Đakđrinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c130c;
    --bg-2: #241a10;
    --panel: #2a1f14;
    --panel-2: #34261a;
    --border: #4a3524;
    --border-soft: #3a2818;
    --text: #f0e6da;
    --text-dim: #b8a58e;
    --text-faint: #8a7460;
    --teal: #2bd9c9;
    --amber: #f5a94e;
    --rose: #f0708a;
    --indigo: #8f97f5;
    --lime: #a8d95c;
    --danger: #f0708a;
    --radius: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 700px at 20% -10%, #3a2818 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; margin:0; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; flex-direction:column; flex-wrap:wrap; gap:16px; align-items:flex-start;
    padding: 28px clamp(16px,4vw,48px) 20px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:auto; height:100px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark .brand-logo-img{ height:100%; width:auto; object-fit:contain; }
  .brand h1{
    font-size: clamp(18px, 5.5vw, 30px);
    letter-spacing: clamp(.01em, .06em, .06em);
    white-space: nowrap;
  }
  .brand p{ margin:2px 0 0; font-size:14px; color:var(--text-dim); }

  .controls{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--border);
    border-radius: 999px; padding: 9px 16px; width: min(320px, 60vw);
  }
  .search-box svg{ width:15px; height:15px; flex:none; color:var(--text-faint); }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text);
    font-family:'Inter'; font-size:13.5px; width:100%;
  }
  .search-box input::placeholder{ color: var(--text-faint); }
  .search-clear{
    display:none; align-items:center; justify-content:center;
    width:18px; height:18px; flex:none; border-radius:50%; cursor:pointer;
    background: var(--border); color:var(--text-dim); border:none;
    font-size:13px; line-height:1; padding:0; transition: all .15s ease;
  }
  .search-clear:hover{ background: var(--teal); color:#04231f; }
  .search-box.has-text .search-clear{ display:flex; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-start; }
  .chip{
    font-family:'Inter'; font-size:12px; font-weight:600; letter-spacing:.02em;
    padding: 7px 13px; border-radius:999px; cursor:pointer; user-select:none;
    background: var(--panel); border:1px solid var(--border); color:var(--text-dim);
    transition: all .15s ease; display:flex; align-items:center; gap:6px;
  }
  .chip:hover{ border-color: var(--teal); color: var(--text); }
  .chip.active{
    background: var(--teal);
    border-color: var(--teal); color: #04231f;
    box-shadow: 0 3px 10px rgba(43,217,201,.45);
    font-weight:700;
  }
  .chip.fav-chip.active{ background: var(--rose); border-color: var(--rose); color: #2a0a10; box-shadow: 0 3px 10px rgba(240,112,138,.45); font-weight:700; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }

  /* ---------- Header area: lighter cream tone override ---------- */
  .topbar{
    background: linear-gradient(180deg, #f7f1e6 0%, #efe4d3 100%);
    border-bottom: 1px solid #d8c8ad;
  }
  .brand h1{ color: #2a1f14; }
  .brand p{ color: #6b5a45; }
  .search-box{
    background: #fffdf9;
    border: 1px solid #d8c8ad;
  }
  .search-box input{ color: #2a1f14; }
  .search-box input::placeholder{ color: #9c8b73; }
  .search-box svg{ color: #9c8b73; }
  .search-clear{ background: #e6d9c2; color: #6b5a45; }
  .search-clear:hover{ background: var(--teal); color:#04231f; }
  .chip{
    background: #fffdf9;
    border: 1px solid #d8c8ad;
    color: #6b5a45;
  }
  .chip:hover{ border-color: var(--teal); color: #2a1f14; }
  /* .chip.active and .chip.fav-chip.active keep their colored highlight above */

  /* ---------- Recent ---------- */
  .recent{ padding: 20px clamp(16px,4vw,48px) 0; }
  .recent h2{ font-size:13px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
  .recent-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .recent-card{
    flex: none; width:150px; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; cursor:pointer; transition: border-color .15s;
  }
  .recent-card:hover{ border-color: var(--teal); }
  .recent-card .t{ font-size:12.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .recent-card .c{ font-size:10.5px; color:var(--text-faint); margin-top:6px; }

  /* ---------- Shelves ---------- */
  main{ padding: 28px clamp(16px,4vw,48px) 0; }
  .shelf-block{ margin-bottom: 44px; }
  .shelf-title{
    display:flex; align-items:center; gap:10px; margin-bottom: 18px;
  }
  .shelf-title .sw{ width:10px; height:10px; border-radius:2px; }
  .shelf-title h2{ font-size:15px; letter-spacing:.03em; }
  .shelf-title .count{ font-size:11.5px; color:var(--text-faint); font-weight:400; white-space:nowrap; margin-left:2px; }

  .shelf{
    position:relative;
    display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;
    padding: 22px 20px 0;
    min-height: 210px;
  }
  .shelf::after{
    content:""; position:absolute; left:0; right:0; bottom:14px; height:12px;
    background: linear-gradient(180deg, #8a5a34 0%, #6b4423 60%, #4a2e17 100%);
    border-radius:4px; box-shadow: 0 8px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .shelf::before{
    content:""; position:absolute; left:0; right:0; bottom:0; height:14px;
    background: linear-gradient(180deg, #4a2e17, #2e1c0e);
    border-radius: 0 0 6px 6px;
  }

  .book{
    position:relative; z-index:1;
    width: 40px; height: 230px;
    border-radius: 4px 6px 6px 4px;
    cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:12px;
    box-shadow: inset 2px 0 0 rgba(255,255,255,.18), inset -3px 0 6px rgba(0,0,0,.35), 0 10px 16px rgba(0,0,0,.35);
    transition: transform .18s ease, box-shadow .18s ease;
    margin-bottom: 26px;
  }
  .book:hover{ transform: translateY(-10px); box-shadow: inset 2px 0 0 rgba(255,255,255,.22), inset -3px 0 6px rgba(0,0,0,.35), 0 16px 22px rgba(0,0,0,.45); }
  .book:focus-visible{ outline: 2px solid var(--teal); outline-offset:3px; }
  .book .spine-title{
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family:'Arial', sans-serif; font-size:14.5px; font-weight:700;
    color: rgba(8,11,18,.92); letter-spacing:.02em; line-height:1.3;
    max-height: 205px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
    text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 1px rgba(255,255,255,.5);
  }
  .book .new-tag{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:#0a1220; color:var(--lime); font-size:8.5px; font-weight:700;
    padding:2px 5px; border-radius:4px; letter-spacing:.04em;
    border:1px solid rgba(168,217,92,.5);
  }
  .book .fav-mark{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:11px; color: rgba(10,14,22,.7);
  }

  .empty-state{
    text-align:center; padding: 70px 20px; color: var(--text-dim);
  }
  .empty-state .big{ font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px; }
  .empty-state .small{ font-size:12.5px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(4,7,13,.72); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
    perspective: 2000px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width:min(920px, 100%); max-height:90vh; overflow:auto;
    background: var(--panel); border:1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); position:relative;
    transform-origin: left center;
    animation: bookOpen .6s cubic-bezier(.18,.86,.30,1) both;
  }
  .modal-overlay.closing .modal{
    animation: bookClose .32s cubic-bezier(.4,0,.7,.3) both;
  }
  @keyframes bookOpen{
    0%   { transform: rotateY(-100deg) scale(.92); opacity:0; box-shadow: -60px 0 80px rgba(0,0,0,.55); }
    55%  { opacity:1; }
    100% { transform: rotateY(0deg) scale(1); opacity:1; box-shadow: var(--shadow); }
  }
  @keyframes bookClose{
    0%   { transform: rotateY(0deg) scale(1); opacity:1; }
    100% { transform: rotateY(-100deg) scale(.92); opacity:0; }
  }
  .modal::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background: linear-gradient(100deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,0) 35%);
    opacity:0; animation: pageShine .6s ease both;
  }
  @keyframes pageShine{
    0%{ opacity:.85; }
    70%{ opacity:.15; }
    100%{ opacity:0; }
  }
  .modal-close{
  position:absolute; top:10px; right:10px; width:44px; height:44px; border-radius:50%;
  background: var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
  font-size:20px; line-height:1; cursor:pointer; z-index:5;
  box-shadow: 0 2px 10px rgba(0,0,0,.5);
  display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ color:var(--text); border-color: var(--teal); }
  .modal-body{ display:grid; grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 720px){ .modal-body{ grid-template-columns: 1fr; } }

  @media (max-width: 480px){
    .brand{ gap:10px; }
    .brand-mark{ height:64px; }
    .brand h1{ font-size: clamp(15px, 6vw, 22px); letter-spacing:.01em; }
    .brand p{ font-size:12px; }
  }
  .modal-preview{ background:#000; min-height:320px; }
  .modal-preview iframe{ width:100%; height:100%; min-height:320px; border:none; display:block; }
  .modal-info{ padding: 26px 26px 28px; display:flex; flex-direction:column; gap:12px; }
  .badge{
    align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:.04em;
    padding:5px 11px; border-radius:999px; color:#0a1220;
  }
  .modal-info h3{ font-size:19px; line-height:1.35; }
  .modal-info .desc{ font-size:13.5px; color: var(--text-dim); line-height:1.6; }
  .modal-info .meta{ font-size:12px; color: var(--text-faint); }
  .modal-actions{ display:flex; gap:10px; margin-top:auto; flex-wrap:wrap; }
  .btn{
    font-family:'Inter'; font-size:13px; font-weight:600; padding:11px 16px; border-radius:8px;
    border:1px solid var(--border); background: var(--panel-2); color:var(--text); cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:7px; transition: all .15s;
  }
  .btn:hover{ border-color: var(--teal); }
  .btn.primary{ background: linear-gradient(145deg, var(--teal), #1ea99b); color:#04231f; border:none; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.fav.active{ color: var(--rose); border-color: var(--rose); }

  footer{
    text-align:center; color: var(--text-faint); font-size:11.5px;
    padding: 30px 20px 0;
  }
  .footer-stats{
    text-align:center; color: var(--text-faint); font-size:12.5px;
    padding: 4px 20px 14px; display:flex; justify-content:center; gap:22px; flex-wrap:wrap;
  }
  .footer-stats span{ font-weight:600; color: var(--text); }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:6px; }
</style>
</head>

<!--
  =====================================================================
  HƯỚNG DẪN THÊM / SỬA SÁCH  (v2 — dữ liệu đã tách ra file books.json)
  =====================================================================
  Dữ liệu sách giờ nằm ở file riêng: books.json (đặt cùng thư mục với
  index.html). Mở file đó lên, sao chép 1 khối { ... } bất kỳ, dán vào
  trước dấu ] đóng mảng, rồi sửa các trường:

    "id"          : mã duy nhất, không trùng (vd "b009")
    "title"       : tên tài liệu hiển thị trên gáy sách và trên modal
    "category"    : tên danh mục (sách cùng danh mục sẽ tự gom vào 1 kệ)
    "description" : mô tả ngắn, hiện trong cửa sổ xem trước
    "driveLink"   : link chia sẻ Google Drive của file (bật chế độ
                    "Bất kỳ ai có đường liên kết" > "Người xem")
    "updated"     : ngày cập nhật, định dạng "YYYY-MM-DD"
    "isNew"       : true nếu muốn ép hiện nhãn "MỚI" (có thể bỏ trường này,
                    hệ thống sẽ tự gắn "MỚI" cho tài liệu cập nhật trong 30 ngày gần nhất)

  Sau khi sửa xong, lưu books.json lại — không cần đụng tới index.html.

  LƯU Ý QUAN TRỌNG: vì index.html giờ dùng fetch() để nạp books.json,
  khi mở index.html bằng cách bấm đúp trực tiếp (file://) trên máy tính,
  trình duyệt có thể chặn fetch do chính sách CORS và kệ sách sẽ trống.
  Cách khắc phục:
    - Chạy qua một local server nhỏ, đứng trong thư mục chứa 2 file rồi gõ:
        python3 -m http.server 8000
      sau đó mở http://localhost:8000/index.html
    - Hoặc đưa cả 2 file (index.html + books.json) lên hosting tĩnh
      (GitHub Pages, Netlify, hoặc chỗ bạn đang lưu trữ hiện tại) —
      khi đó fetch hoạt động bình thường như trên điện thoại/di động.
  =====================================================================
-->
<!-- Dữ liệu sách đã chuyển sang file books.json, xem hướng dẫn phía trên -->

<script>
(async function(){
  const PALETTE = [
    { name:'teal',   base:'#2bd9c9', dark:'#189184' },
    { name:'amber',  base:'#f5a94e', dark:'#b8752a' },
    { name:'rose',   base:'#f0708a', dark:'#b04159' },
    { name:'indigo', base:'#8f97f5', dark:'#5a5fc4' },
    { name:'lime',   base:'#a8d95c', dark:'#6f9a2c' },
    { name:'sand',   base:'#e0c78a', dark:'#a3894e' }
  ];

  let books;
  try {
    const res = await fetch('books.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    books = await res.json();
  } catch (err) {
    console.error('Không nạp được books.json:', err);
    document.querySelector('#shelves, main, body').insertAdjacentHTML(
      'afterbegin',
      '<div style="padding:20px;color:#f0708a;font-family:sans-serif">' +
      '⚠️ Không tải được dữ liệu sách (books.json). Nếu bạn đang mở file trực tiếp ' +
      '(file://), hãy chạy qua local server hoặc đưa lên hosting. Chi tiết lỗi: ' +
      String(err.message || err) + '</div>'
    );
    return;
  }

  // ===== Thống kê footer: tổng số sách + lượt truy cập =====
  const totalBooksEl = document.getElementById('totalBooks');
  if (totalBooksEl) totalBooksEl.textContent = books.length;

  (async function updateVisitCounter(){
    const visitCountEl = document.getElementById('visitCount');
    if (!visitCountEl) return;
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbuLZulJruUZcn3s-LNdIU1irIxBJUZXd6MeObO2TWxX_OQFFoZWQJ_5tLebkOQYZJ6w/exec';
    const alreadyCounted = sessionStorage.getItem('tuSachVisitCounted');
    const url = alreadyCounted ? `${APPS_SCRIPT_URL}?action=count` : APPS_SCRIPT_URL;
    try {
      const res = await fetch(url);
      const data = await res.json();
      visitCountEl.textContent = data.count;
      if (!alreadyCounted) sessionStorage.setItem('tuSachVisitCounted', '1');
    } catch (err) {
      console.error('Không lấy được số lượt truy cập:', err);
      visitCountEl.textContent = 'N/A';
    }
  })();

  const categories = [...new Set(books.map(b => b.category))];
  const catColor = {};
  categories.forEach((c,i) => catColor[c] = PALETTE[i % PALETTE.length]);

  const FAV_KEY = 'tuSachFavorites';
  const RECENT_KEY = 'tuSachRecent';
  const getFavs = () => new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
  const saveFavs = (set) => localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
  const getRecent = () => JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
  const saveRecent = (arr) => localStorage.setItem(RECENT_KEY, JSON.stringify(arr));

  function extractDriveId(url){
    const m1 = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
    if (m1) return m1[1];
    const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if (m2) return m2[1];
    return null;
  }

  function isRecentlyUpdated(dateStr){
    const d = new Date(dateStr);
    const diffDays = (Date.now() - d.getTime()) / 86400000;
    return diffDays >= 0 && diffDays <= 30;
  }

  function fmtDate(dateStr){
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
  }

  let state = { search:'', category:'all' };

  function renderChips(){
    const wrap = document.getElementById('categoryChips');
    wrap.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'chip' + (state.category === 'all' ? ' active' : '');
    all.textContent = 'Tất cả';
    all.onclick = () => { state.category = 'all'; render(); };
    wrap.appendChild(all);

    categories.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.category === cat ? ' active' : '');
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = catColor[cat].base;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(cat));
      chip.onclick = () => { state.category = cat; render(); };
      wrap.appendChild(chip);
    });

    const fav = document.createElement('div');
    fav.className = 'chip fav-chip' + (state.category === 'favorites' ? ' active' : '');
    fav.textContent = '★ YÊU THÍCH';
    fav.onclick = () => { state.category = 'favorites'; render(); };
    wrap.appendChild(fav);
  }

  function matchesSearch(book){
    if (!state.search) return true;
    const q = state.search.toLowerCase();
    return book.title.toLowerCase().includes(q)
      || book.description.toLowerCase().includes(q)
      || book.category.toLowerCase().includes(q);
  }

  function getFiltered(){
    const favs = getFavs();
    return books.filter(b => {
      if (state.category === 'favorites' && !favs.has(b.id)) return false;
      if (state.category !== 'all' && state.category !== 'favorites' && b.category !== state.category) return false;
      return matchesSearch(b);
    });
  }

  function bookEl(book){
    const favs = getFavs();
    const el = document.createElement('div');
    el.className = 'book';
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label', book.title);
    el.title = book.title;
    const color = catColor[book.category];
    el.style.background = `linear-gradient(120deg, ${color.base} 0%, ${color.dark} 100%)`;

    const newTag = (book.isNew !== undefined ? book.isNew : isRecentlyUpdated(book.updated));
    if (newTag){
      const tag = document.createElement('span');
      tag.className = 'new-tag';
      tag.textContent = 'MỚI';
      el.appendChild(tag);
    }

    const title = document.createElement('span');
    title.className = 'spine-title';
    title.textContent = book.title;
    el.appendChild(title);

    if (favs.has(book.id)){
      const fm = document.createElement('span');
      fm.className = 'fav-mark';
      fm.textContent = '★';
      el.appendChild(fm);
    }

    const open = () => openModal(book);
    el.onclick = open;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    return el;
  }

  function render(){
    renderChips();
    const shelves = document.getElementById('shelves');
    shelves.innerHTML = '';
    const filtered = getFiltered();

    if (filtered.length === 0){
      shelves.innerHTML = `<div class="empty-state">
        <div class="big">Không tìm thấy tài liệu phù hợp</div>
        <div class="small">Thử từ khóa khác hoặc chọn "Tất cả" để xem toàn bộ tủ sách.</div>
      </div>`;
      return;
    }

    let groups;
    if (state.category === 'all' || state.category === 'favorites'){
      groups = {};
      filtered.forEach(b => { (groups[b.category] = groups[b.category] || []).push(b); });
    } else {
      groups = { [state.category]: filtered };
    }

    Object.keys(groups).forEach(catName => {
      const block = document.createElement('div');
      block.className = 'shelf-block';

      const titleRow = document.createElement('div');
      titleRow.className = 'shelf-title';
      const sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = catColor[catName].base;
      const h2 = document.createElement('h2');
	h2.textContent = catName + ' ';
	const count = document.createElement('span');
	count.className = 'count';
	count.textContent = `${groups[catName].length} tài liệu`;
	h2.appendChild(count);
	titleRow.append(sw, h2);
      block.appendChild(titleRow);

      const shelf = document.createElement('div');
      shelf.className = 'shelf';
      groups[catName].forEach(b => shelf.appendChild(bookEl(b)));
      block.appendChild(shelf);

      shelves.appendChild(block);
    });
  }

  function renderRecent(){
    const ids = getRecent();
    const section = document.getElementById('recentSection');
    const row = document.getElementById('recentRow');
    if (!ids.length){ section.hidden = true; return; }
    section.hidden = false;
    row.innerHTML = '';
    ids.forEach(id => {
      const book = books.find(b => b.id === id);
      if (!book) return;
      const card = document.createElement('div');
      card.className = 'recent-card';
      card.innerHTML = `<div class="t">${escapeHtml(book.title)}</div><div class="c">${escapeHtml(book.category)}</div>`;
      card.onclick = () => openModal(book);
      row.appendChild(card);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pushRecent(id){
    let ids = getRecent().filter(x => x !== id);
    ids.unshift(id);
    ids = ids.slice(0, 8);
    saveRecent(ids);
    renderRecent();
  }

  let currentBook = null;

  function openModal(book){
    currentBook = book;
    const driveId = extractDriveId(book.driveLink);
    const iframe = document.getElementById('modalIframe');
    iframe.src = driveId ? `https://drive.google.com/file/d/${driveId}/preview` : '';

    const catBadge = document.getElementById('modalCategory');
    catBadge.textContent = book.category;
    catBadge.style.background = catColor[book.category].base;

    document.getElementById('modalTitle').textContent = book.title;
    document.getElementById('modalDesc').textContent = book.description || '';
    document.getElementById('modalMeta').textContent = `Cập nhật: ${fmtDate(book.updated)}`;
    document.getElementById('modalOpenBtn').href = book.driveLink;

    updateFavBtn();
    document.getElementById('modalOverlay').classList.add('open');
    pushRecent(book.id);
  }

  function updateFavBtn(){
    const favs = getFavs();
    const btn = document.getElementById('modalFavBtn');
    const isFav = currentBook && favs.has(currentBook.id);
    btn.textContent = isFav ? '★ ĐÃ YÊU THÍCH' : '☆ YÊU THÍCH';
    btn.classList.toggle('active', isFav);
  }

  function closeModal(){
    const overlay = document.getElementById('modalOverlay');
    if (overlay.classList.contains('closing')) return;
    overlay.classList.add('closing');
    setTimeout(() => {
      overlay.classList.remove('open');
      overlay.classList.remove('closing');
      document.getElementById('modalIframe').src = '';
      currentBook = null;
    }, 320);
  }

  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  document.getElementById('modalFavBtn').onclick = () => {
    if (!currentBook) return;
    const favs = getFavs();
    if (favs.has(currentBook.id)) favs.delete(currentBook.id);
    else favs.add(currentBook.id);
    saveFavs(favs);
    updateFavBtn();
    render();
  };

  let searchTimer;
  const searchInputEl = document.getElementById('searchInput');
  const searchBoxEl = searchInputEl.closest('.search-box');
  const searchClearEl = document.getElementById('searchClear');

  function toggleSearchClear(){
    searchBoxEl.classList.toggle('has-text', searchInputEl.value.length > 0);
  }

  searchInputEl.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    toggleSearchClear();
    searchTimer = setTimeout(() => { state.search = val; render(); }, 120);
  });

  searchClearEl.addEventListener('click', () => {
    searchInputEl.value = '';
    state.search = '';
    toggleSearchClear();
    searchInputEl.focus();
    render();
  });

  render();
  renderRecent();
})();
</script>

</body>
</html>
